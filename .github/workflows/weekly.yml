name: weekly-log

on:
  schedule:
    # Mondays 18:00 UTC (11:00 am PDT): collect the just-completed Mon-Sun week
    - cron: "0 18 * * 1"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect last week and rebuild the log page
        run: python3 weekly.py

      - name: Commit results
        run: |
          git config user.name "truckee-flights weekly job"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly docs/weekly.html
          git diff --cached --quiet || git commit -m "Weekly log: $(date -u +%F)"
          git push
