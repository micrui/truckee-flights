name: quiet-hours-log

on:
  schedule:
    # Nightly 04:15 UTC (~9:15 pm Pacific): the UTC day just closed, so the
    # night that ended at 08:30 this morning is now published; add it.
    - cron: "15 4 * * *"
    # Morning fallback 15:45 UTC (~8:45 am Pacific): catch late archives so
    # the page is current for morning readers.
    - cron: "45 15 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add the latest night and rebuild the quiet-hours log
        run: python3 weekly.py

      - name: Commit results
        run: |
          git config user.name "truckee-flights weekly job"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly docs
          git diff --cached --quiet || git commit -m "Quiet hours: $(date -u +%F)"
          git push
