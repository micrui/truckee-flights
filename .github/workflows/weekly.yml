name: quiet-hours-log

on:
  # Schedule off since 2026-11-18. From 2026-10-29 the ADS-B Exchange history archive
  # serves its files only to a browser session that passed the check on its map page,
  # so this job, which is not a browser, was refused twice a day. Collection now runs
  # on the maintainer's workstation (METHOD.md, "Where the collector runs"). The cron
  # entries are kept below for reference; a manual run here will be refused the same way.
  #
  # schedule:
  #   # Nightly 04:15 UTC (~9:15 pm Pacific): the UTC day just closed, so the
  #   # night that ended at 08:30 this morning is now published; add it.
  #   - cron: "15 4 * * *"
  #   # Morning fallback 15:45 UTC (~8:45 am Pacific): catch late archives so
  #   # the page is current for morning readers.
  #   - cron: "45 15 * * *"
  workflow_dispatch:
    inputs:
      probe_date:
        description: >-
          Fetch-only diagnostic: pull this UTC date (YYYY-MM-DD) from the
          archive and print slice/trace counts; writes nothing to the repo.
        required: false
        default: ""

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe the archive (manual diagnostic only)
        if: github.event.inputs.probe_date != ''
        run: >
          python3 -c "from pipeline import run_day;
          r = run_day('${{ github.event.inputs.probe_date }}', window='full');
          print('records:', len(r))"

      - name: Add the latest night and rebuild the quiet-hours log
        if: github.event.inputs.probe_date == ''
        run: python3 weekly.py

      - name: Commit results
        if: github.event.inputs.probe_date == ''
        run: |
          git config user.name "truckee-flights weekly job"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly docs
          git diff --cached --quiet || git commit -m "Quiet hours: $(date -u +%F)"
          git push
